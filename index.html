<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RateMe">
<meta name="mobile-web-app-capable" content="yes">
<title>RateMe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#11088;</text></svg>">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --star-on: #f5a623;
    --star-off: #d3d7de;
    --danger: #d64545;
    --ok: #18794e;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --surface: #1c1f25; --border: #2c313a;
      --text: #e9ecf1; --muted: #9aa3b2;
      --accent: #7c74f5; --accent-text: #0f1115;
      --star-off: #3a404b; --danger: #ff8080; --ok: #4ade80;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --surface: #1c1f25; --border: #2c313a;
    --text: #e9ecf1; --muted: #9aa3b2;
    --accent: #7c74f5; --accent-text: #0f1115;
    --star-off: #3a404b; --danger: #ff8080; --ok: #4ade80;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
  }
  .header-inner {
    max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 40px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }

  .session { display: flex; align-items: center; gap: 8px; }
  .who { font-size: 13px; color: var(--muted); }
  .who b { color: var(--text); }

  /* ---------- layout ---------- */
  main {
    max-width: 560px; margin: 0 auto;
    padding: 16px;
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px 18px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .card p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }

  /* ---------- form ---------- */
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;            /* 16px min: stops iOS auto-zoom on focus */
    line-height: 1.3;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }

  button {
    font: inherit; font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-text);
    min-height: 48px;           /* comfortable touch target */
    padding: 12px 18px;
    touch-action: manipulation; /* kills 300ms double-tap zoom delay */
  }
  button:active:not(:disabled) { transform: scale(.985); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.block { width: 100%; }
  button.ghost {
    background: transparent; color: var(--muted); border-color: var(--border);
    min-height: 40px; padding: 8px 14px; font-size: 14px;
  }
  button.ghost:active { color: var(--text); }

  /* ---------- stars ---------- */
  .stars {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin: 6px 0 20px;
  }
  .star {
    flex: 1 1 0;
    background: none; border: none; padding: 0;
    min-height: 60px;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; line-height: 1;
    color: var(--star-off);
    transition: color .12s ease, transform .08s ease;
    touch-action: manipulation;
  }
  .star.on { color: var(--star-on); }
  .star:active { transform: scale(1.15); }
  .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .error { color: var(--danger); font-size: 14px; margin: -4px 0 12px; min-height: 20px; }
  .msg   { color: var(--ok);     font-size: 14px; margin-top: 14px; min-height: 20px; }

  /* ---------- received ---------- */
  .summary { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
  .avg { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .avg-stars { font-size: 22px; color: var(--star-on); letter-spacing: 3px; }
  .count { color: var(--muted); font-size: 14px; margin-top: 6px; }

  ul.history { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--border); }
  ul.history li {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  ul.history .h-stars { color: var(--star-on); letter-spacing: 3px; font-size: 17px; }
  ul.history .h-from { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
  ul.history .h-date { color: var(--muted); font-size: 13px; text-align: right; flex-shrink: 0; }

  .empty { color: var(--muted); font-size: 15px; padding: 6px 0; }

  .note {
    margin-top: 4px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }

  .hidden { display: none !important; }

  /* ---------- very small phones ---------- */
  @media (max-width: 360px) {
    h1 { font-size: 20px; }
    .who { display: none; }
    .card { padding: 18px 15px; }
    .star { font-size: 36px; min-height: 54px; }
    .avg { font-size: 34px; }
  }

  /* ---------- wider screens ---------- */
  @media (min-width: 600px) {
    main { padding-top: 24px; }
    .card { padding: 24px; }
    .stars { justify-content: flex-start; gap: 8px; }
    .star { flex: 0 0 auto; width: 58px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    button:active:not(:disabled), .star:active { transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Rate<span>Me</span></h1>
    <div id="session-box" class="session hidden">
      <span class="who">Signed in as <b id="who-name"></b></span>
      <button class="ghost" id="logout-btn" type="button">Log out</button>
    </div>
  </div>
</header>

<main>
  <section id="login-view" class="card">
    <h2>Log in</h2>
    <p class="sub">Sign in to rate and to see the ratings you were given.</p>
    <form id="login-form" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             autocapitalize="none" autocorrect="off" autocomplete="username"
             enterkeyhint="next" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" enterkeyhint="go" inputmode="numeric" required>
      <div class="error" id="login-error" role="alert"></div>
      <button class="block" type="submit">Log in</button>
    </form>
  </section>

  <section id="rate-view" class="card hidden">
    <h2>Rate <span id="target-name"></span></h2>
    <p class="sub">Tap 1&ndash;5 stars, then submit. You can change it any time.</p>
    <div class="stars" id="star-picker" role="radiogroup" aria-label="Rating in stars"></div>
    <button class="block" id="submit-btn" type="button" disabled>Submit rating</button>
    <div class="msg" id="submit-msg" role="status"></div>
  </section>

  <section id="received-view" class="card hidden">
    <h2>Your ratings</h2>
    <p class="sub">What <span id="rater-name"></span> has given you.</p>
    <div id="received-body"></div>
    <div class="note" id="device-note"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var USERS = {
    kobi:  { password: "123456",  display: "Kobi",  partner: "sivan" },
    sivan: { password: "1234567", display: "Sivan", partner: "kobi"  }
  };

  var STORE_KEY = "rateme.ratings.v1";
  var SESSION_KEY = "rateme.session.v1";

  var el = {
    loginView:    document.getElementById("login-view"),
    loginForm:    document.getElementById("login-form"),
    username:     document.getElementById("username"),
    password:     document.getElementById("password"),
    loginError:   document.getElementById("login-error"),
    sessionBox:   document.getElementById("session-box"),
    whoName:      document.getElementById("who-name"),
    logoutBtn:    document.getElementById("logout-btn"),
    rateView:     document.getElementById("rate-view"),
    targetName:   document.getElementById("target-name"),
    starPicker:   document.getElementById("star-picker"),
    submitBtn:    document.getElementById("submit-btn"),
    submitMsg:    document.getElementById("submit-msg"),
    receivedView: document.getElementById("received-view"),
    raterName:    document.getElementById("rater-name"),
    receivedBody: document.getElementById("received-body"),
    deviceNote:   document.getElementById("device-note")
  };

  var currentUser = null;
  var selected = 0;

  /* ---------- storage (guarded: private mode / blocked site data) ---------- */

  function loadRatings() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function saveRatings(list) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
  }

  function loadSession() {
    try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; }
  }

  function saveSession(id) {
    try {
      if (id) localStorage.setItem(SESSION_KEY, id);
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* login just won't survive a reload */ }
  }

  /* ---------- rating data ---------- */

  function ratingsFor(toId) {
    return loadRatings()
      .filter(function (r) { return r.to === toId; })
      .sort(function (a, b) { return b.ts - a.ts; });
  }

  function myRatingOf(fromId, toId) {
    var mine = loadRatings().filter(function (r) { return r.from === fromId && r.to === toId; });
    if (!mine.length) return null;
    return mine.sort(function (a, b) { return b.ts - a.ts; })[0];
  }

  function submitRating(fromId, toId, stars) {
    var list = loadRatings().filter(function (r) {
      return !(r.from === fromId && r.to === toId);
    });
    list.push({ from: fromId, to: toId, stars: stars, ts: Date.now() });
    return saveRatings(list);
  }

  /* ---------- helpers ---------- */

  function starString(n) {
    return "★".repeat(n) + "☆".repeat(5 - n);
  }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  function formatDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
           " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- rendering ---------- */

  function buildStarPicker() {
    el.starPicker.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "star";
      b.dataset.value = String(i);
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", "false");
      b.setAttribute("aria-label", plural(i, "star"));
      b.textContent = "★";
      b.addEventListener("click", onStarClick);
      el.starPicker.appendChild(b);
    }
  }

  function onStarClick(e) {
    setSelected(Number(e.currentTarget.dataset.value));
    el.submitMsg.textContent = "";
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
  }

  function setSelected(value) {
    selected = value;
    var stars = el.starPicker.querySelectorAll(".star");
    for (var i = 0; i < stars.length; i++) {
      var v = Number(stars[i].dataset.value);
      stars[i].classList.toggle("on", v <= value);
      stars[i].setAttribute("aria-checked", v === value ? "true" : "false");
    }
    el.submitBtn.disabled = value < 1;
  }

  function renderReceived(user) {
    var partnerName = USERS[user.partner].display;
    var list = ratingsFor(user.id);

    if (!list.length) {
      el.receivedBody.innerHTML = '<div class="empty">No ratings yet — nothing from ' +
        escapeHtml(partnerName) + ' on this device.</div>';
      return;
    }

    var sum = list.reduce(function (acc, r) { return acc + r.stars; }, 0);
    var avg = sum / list.length;

    var html = '' +
      '<div class="summary">' +
        '<span class="avg">' + avg.toFixed(1) + '</span>' +
        '<span class="avg-stars">' + starString(Math.round(avg)) + '</span>' +
      '</div>' +
      '<div class="count">' + plural(list.length, "rating") + ' received</div>' +
      '<ul class="history">';

    list.forEach(function (r) {
      var fromName = USERS[r.from] ? USERS[r.from].display : r.from;
      html += '<li>' +
        '<span>' +
          '<span class="h-stars">' + starString(r.stars) + '</span>' +
          '<span class="h-from">from ' + escapeHtml(fromName) + '</span>' +
        '</span>' +
        '<span class="h-date">' + escapeHtml(formatDate(r.ts)) + '</span>' +
      '</li>';
    });

    el.receivedBody.innerHTML = html + '</ul>';
  }

  /* ---------- views ---------- */

  function showLoggedIn(userId) {
    var user = USERS[userId];
    var partnerName = USERS[user.partner].display;
    currentUser = { id: userId, display: user.display, partner: user.partner };

    el.whoName.textContent = user.display;
    el.sessionBox.classList.remove("hidden");
    el.loginView.classList.add("hidden");
    el.rateView.classList.remove("hidden");
    el.receivedView.classList.remove("hidden");

    el.targetName.textContent = partnerName;
    el.raterName.textContent = partnerName;
    el.deviceNote.innerHTML = 'Ratings are stored <b>on this device only</b>. ' +
      'A rating ' + escapeHtml(partnerName) + ' submits on ' +
      escapeHtml(partnerName) + '&rsquo;s own phone stays on that phone and will not appear here.';

    buildStarPicker();
    var existing = myRatingOf(userId, user.partner);
    if (existing) {
      setSelected(existing.stars);
      el.submitMsg.textContent = "Your current rating: " + plural(existing.stars, "star") + ".";
    } else {
      setSelected(0);
      el.submitMsg.textContent = "";
    }

    renderReceived(currentUser);
    window.scrollTo(0, 0);
  }

  function showLoggedOut() {
    currentUser = null;
    selected = 0;
    el.sessionBox.classList.add("hidden");
    el.loginView.classList.remove("hidden");
    el.rateView.classList.add("hidden");
    el.receivedView.classList.add("hidden");
    el.loginForm.reset();
    el.loginError.textContent = "";
    el.submitMsg.textContent = "";
  }

  /* ---------- events ---------- */

  el.loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var id = el.username.value.trim().toLowerCase();
    var pw = el.password.value;
    var user = USERS[id];

    if (!user || user.password !== pw) {
      el.loginError.textContent = "Wrong username or password.";
      el.password.value = "";
      el.password.focus();
      return;
    }
    el.loginError.textContent = "";
    el.password.blur();           /* dismiss the mobile keyboard */
    saveSession(id);
    showLoggedIn(id);
  });

  el.logoutBtn.addEventListener("click", function () {
    saveSession(null);
    showLoggedOut();
  });

  el.submitBtn.addEventListener("click", function () {
    if (!currentUser || selected < 1) return;
    var partnerName = USERS[currentUser.partner].display;
    var ok = submitRating(currentUser.id, currentUser.partner, selected);
    el.submitMsg.textContent = ok
      ? "Saved — you rated " + partnerName + " " + plural(selected, "star") + "."
      : "Could not save: this browser is blocking local storage.";
    if (ok && navigator.vibrate) { try { navigator.vibrate(18); } catch (err) {} }
    renderReceived(currentUser);
  });

  /* Reflect changes made in another tab on the same device. */
  window.addEventListener("storage", function (e) {
    if (e.key === STORE_KEY && currentUser) renderReceived(currentUser);
  });

  /* ---------- boot ---------- */

  var restored = loadSession();
  if (restored && USERS[restored]) showLoggedIn(restored);
  else showLoggedOut();
})();
</script>

</body>
</html>
